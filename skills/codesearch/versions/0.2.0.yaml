content:
  abstract: |
    Search every indexed MUR project at once.
    Install once (see context, step 1 — the manifest carries the script), then:
    `bash ~/.mur/skills/codesearch/scripts/codesearch.sh "<query>"`
    Fans out one process per project and merges by score, because
    `mur project search --all` is broken on mixed embedding dims.
  context: |
    # codesearch — cross-project semantic search

    Searches every indexed MUR project in parallel and merges the hits into one
    score-sorted list. No LLM in the loop: `mur project search` is already hybrid
    vector+BM25, so the semantic work happens inside the index. ~1.4s over 34
    projects, zero tokens.

    This skill carries its own script. The registry only publishes this manifest,
    so step 1 writes the script out; do it once.

    ## 1. Install the script

    Paste this whole block into a shell. The quoted delimiter matters — it stops
    the shell expanding `$1`, `$HOME` and the awk `$3` field refs inside.

    ```bash
    mkdir -p ~/.mur/skills/codesearch/scripts
    cat > ~/.mur/skills/codesearch/scripts/codesearch.sh <<'CODESEARCH_EOF'
    #!/bin/bash
    # codesearch — parallel semantic search across all indexed MUR projects.
    # Usage: codesearch.sh <query> [--limit N] [--jobs N] [--top N] [--filter GLOB]
    #                      [--min SCORE] [--no-dedupe] [--worktrees] [--json]
    # Git worktree snapshots (mur--*) are excluded unless --worktrees is given.
    # Works on macOS bash 3.2 (no mapfile, no associative arrays).
    set -u

    QUERY=""; LIMIT=3; JOBS=16; FILTER="*"; JSON=0; TOP=40; DEDUPE=1; MIN=0.60; WT=0
    while [ $# -gt 0 ]; do
      case "$1" in
        --limit)  LIMIT="$2"; shift 2 ;;
        --jobs)   JOBS="$2";  shift 2 ;;
        --top)    TOP="$2";   shift 2 ;;
        --filter) FILTER="$2"; shift 2 ;;
        --min)    MIN="$2";   shift 2 ;;
        --no-dedupe) DEDUPE=0; shift ;;
        --worktrees) WT=1; shift ;;
        --json)   JSON=1; shift ;;
        -h|--help) sed -n '2,5p' "$0"; exit 0 ;;
        *) if [ -z "$QUERY" ]; then QUERY="$1"; else QUERY="$QUERY $1"; fi; shift ;;
      esac
    done
    [ -z "$QUERY" ] && { echo "codesearch: no query given" >&2; exit 2; }

    IDX="$HOME/.mur/indexes/codebase"
    [ -d "$IDX" ] || { echo "codesearch: no index store at $IDX" >&2; exit 1; }

    OUT=$(mktemp -d) || exit 1
    trap 'rm -rf "$OUT"' EXIT
    LIST="$OUT/.projects"

    # Canonical project list = one .lance dir per indexed project.
    ls -d "$IDX"/*.lance 2>/dev/null | sed 's|.*/||; s|\.lance$||' > "$LIST"

    # Git worktree snapshots (mur--<branch>) duplicate the main repo 59x over.
    # Drop them unless explicitly asked for -- but an explicit --filter wins,
    # so `--filter 'mur--*'` still works without needing --worktrees.
    if [ "$WT" -eq 0 ] && [ "$FILTER" = "*" ]; then
      grep -v '^mur--' "$LIST" > "$LIST.w" 2>/dev/null
      mv "$LIST.w" "$LIST"
    fi

    # Optional name filter (glob on project name).
    if [ "$FILTER" != "*" ]; then
      # Translate the glob to an anchored ERE without letting awk parse it.
      RE=$(printf '%s' "$FILTER" | sed -e 's/[.[\]$()|+^{}]/\\&/g' -e 's/\*/.*/g' -e 's/?/./g')
      grep -E "^${RE}$" "$LIST" > "$LIST.f" 2>/dev/null
      mv "$LIST.f" "$LIST"
    fi

    N=$(grep -c . "$LIST" 2>/dev/null | tr -d ' ')
    [ -z "$N" ] && N=0
    [ "$N" -eq 0 ] && { echo "codesearch: no indexed project matched" >&2; exit 1; }

    # `mur project search --all` is broken (mixed embedding dims across projects),
    # so fan out one process per project and merge ourselves.
    tr '\n' '\0' < "$LIST" | xargs -0 -P "$JOBS" -I{} \
      sh -c 'mur project search "$1" --project "$2" --limit "$3" --json >"$4/$2.json" 2>/dev/null' \
          _ "$QUERY" {} "$LIMIT" "$OUT"

    if [ "$JSON" -eq 1 ]; then
      jq -s 'add // [] | sort_by(-.score)' "$OUT"/*.json 2>/dev/null || echo '[]'
      exit 0
    fi

    jq -r '
      (. // []) | .[]
      | [ (.score|tostring), .project, .file, ((.line_start // 0)|tostring), (.symbol // "-") ]
      | @tsv
    ' "$OUT"/*.json 2>/dev/null \
      | sort -t"$(printf '\t')" -k1,1gr \
      | awk -F'\t' -v top="$TOP" -v np="$N" -v dd="$DEDUPE" -v min="$MIN" '
          BEGIN{ n=0; shown=0; weak=0 }
          {
            if ($1 + 0 < min + 0) { weak++; next }
            n++
            key = $3 ":" $4 ":" $5           # same file:line:symbol = same hit
            if (dd == 1) {
              if (key in seen) { dup[key]++; next }
              seen[key] = 1
            }
            u++
            if (shown < top) {
              shown++
              line[shown] = sprintf("%6.3f  %-20s %s:%s  (%s)", $1, $2, $3, $4, $5)
              lkey[shown] = key
            }
          }
          END{
            if (n == 0) {
              printf "no matches above score %.2f", min
              if (weak > 0) printf " (%d weaker hits suppressed; --min 0 to see them)", weak
              print ""
              exit
            }
            for (i = 1; i <= shown; i++) {
              c = dup[lkey[i]]
              if (dd == 1 && c > 0) printf "%s  [+%d copies]\n", line[i], c
              else print line[i]
            }
            if (dd == 1) {
              printf "\n-- %d unique hits (%d raw) over %d projects, showing top %d", u, n, np, shown
            } else {
              printf "\n-- %d matches over %d projects, showing top %d", n, np, shown
            }
            if (weak > 0) printf ", %d below --min %.2f", weak, min
            printf "\n"
          }'
    CODESEARCH_EOF
    chmod +x ~/.mur/skills/codesearch/scripts/codesearch.sh
    ```

    Verify it landed:

    ```bash
    bash ~/.mur/skills/codesearch/scripts/codesearch.sh --help
    ```

    ## 2. Run it

    ```bash
    bash ~/.mur/skills/codesearch/scripts/codesearch.sh "<query>" [options]
    ```

    Call it with an explicit `bash`. The shebang is unusable under a MUR sandbox
    because `/usr/bin/env` is blocked.

    ## Options

    - `--limit N`   (3)    hits requested per project
    - `--jobs N`    (16)   parallel processes
    - `--top N`     (40)   rows printed after merge
    - `--min SCORE` (0.60) drop hits below this score
    - `--filter GLOB` (*)  restrict to project names matching the glob
    - `--worktrees` (off)  include `mur--*` git worktree snapshots
    - `--no-dedupe` (off)  keep duplicate `file:line:symbol` rows
    - `--json`      (off)  emit merged raw JSON instead of a table

    ## Why it fans out instead of using --all

    `mur project search --all` fails outright:

    ```
    Error: Invalid input, No vector column found to match with the query vector dimension: 1024
    ```

    Projects were embedded with different model dimensions and cannot share one
    vector query. One process per project sidesteps it.

    ## Worktrees

    If you keep git worktrees, each one gets its own `.lance` index and every real
    hit shows up as `[+N copies]`. Names matching `mur--*` are excluded by default;
    `--worktrees` includes them, and an explicit `--filter 'mur--*'` also overrides
    the exclusion so you can search a branch snapshot deliberately.

    ## Notes

    - Project list source is `~/.mur/indexes/codebase/*.lance`. Do NOT use
      `~/.mur/projects/*.json` — it holds stale entries including /tmp paths.
    - Result JSON fields are `file`, `line_start`, `symbol` — not `path`/`line`.
    - Written for macOS bash 3.2: no `mapfile`, no associative arrays.
    - `--min 0.60` is calibrated by observation, not derived. Re-tune if it drops
      hits you wanted.
    - Requires `jq`.
